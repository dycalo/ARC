name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run smoke
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: arc-node-${{ matrix.node }}
          path: dycalo-arc-*.tgz
          if-no-files-found: error
