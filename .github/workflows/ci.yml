name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run smoke
      - run: npm run soak
      - run: npm run smoke:harness
        if: matrix.node == '22.22.2'
        timeout-minutes: 15
        env:
          ARC_SMOKE_TOOLCHAIN: ${{ runner.temp }}/arc-dsh
      - name: Verify evaluation driver and output caps with synthetic responses
        if: matrix.node == '22.22.2'
        timeout-minutes: 5
        env:
          ARC_SMOKE_TOOLCHAIN: ${{ runner.temp }}/arc-dsh
        run: |
          node scripts/evaluation/dsh-offline-smoke.mjs "$ARC_SMOKE_TOOLCHAIN"
          node scripts/evaluation/dsh-budget-smoke.mjs "$ARC_SMOKE_TOOLCHAIN"
          node scripts/evaluation/dsh-output-cap-smoke.mjs "$ARC_SMOKE_TOOLCHAIN"
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: arc-node-${{ matrix.node }}
          path: dycalo-arc-*.tgz
          if-no-files-found: error
